<style>
:root{
  --bg:#f6f5f8;
  --card:#ffffff;
  --primary:#af62ff;
  --primary-dark:#8f3fe6;
  --ink:#000000;
  --text:#1a1a1a;
  --text-soft:#6b6b6b;
  --border:#e7e3ee;
  --danger:#e5484d;
  --danger-bg:#fdeceb;
  --success:#2e9e5b;
  --radius:14px;
  --shadow:0 4px 18px rgba(0,0,0,0.08);
  --font-heading:'Playfair Display', Georgia, serif;
  --font-body:'Raleway', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
}
h1, h2{ font-family:var(--font-heading); }
header{
  background:var(--primary-dark);
  color:#fff;
  padding:22px 20px 70px;
  position:relative;
}
header::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:4px;
  background:var(--primary);
}
header h1{
  margin:0 0 6px;
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:.3px;
}
header p{
  margin:0;
  opacity:.8;
  font-size:.9rem;
  font-family:var(--font-body);
}
.wrap{
  max-width:1200px;
  margin:0 auto;
  padding:0 16px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
  margin-top:-52px;
}
.stat-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
}
.stat-card .num{
  font-size:1.5rem;
  font-weight:700;
}
.stat-card .lbl{
  font-size:.78rem;
  color:var(--text-soft);
}
.stat-card.low .num{color:var(--danger);}
.toolbar{
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}
.toolbar input[type=text], .toolbar select{
  padding:10px 12px;
  border-radius:10px;
  border:1.5px solid var(--primary);
  background:var(--card);
  font-size:.9rem;
  color:var(--text);
}
.toolbar input[type=text]{flex:1;min-width:180px;}
.toolbar input[type=text]:focus, .toolbar select:focus{
  outline:none;
  border-color:var(--primary-dark);
  box-shadow:0 0 0 3px rgba(175,98,255,.18);
}
.btn{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-size:.88rem;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--border);}
.btn-ghost:hover{background:#f6f3ff;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:.78rem;border-radius:8px;}
.menu-wrap{position:relative;}
.menu{
  position:absolute;right:0;top:calc(100% + 6px);
  background:#fff;border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);min-width:190px;z-index:40;overflow:hidden;
  display:none;
}
.menu.open{display:block;}
.menu button, .menu label{
  display:block;width:100%;text-align:left;background:none;border:none;
  padding:10px 14px;font-size:.85rem;cursor:pointer;color:var(--text);
}
.menu button:hover, .menu label:hover{background:#f6f3ff;}

.grid{
  margin:20px 0 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  border:2px solid transparent;
  transition:transform .1s ease;
}
.card:hover{transform:translateY(-2px);}
.card.low{border-color:var(--danger);}
.thumb{
  width:100%;
  aspect-ratio:1/1;
  background:#f2effc;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb svg{width:38%;height:38%;color:#c9c1ec;}
.low-badge{
  position:absolute;top:6px;left:6px;
  background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;
  padding:3px 7px;border-radius:20px;
}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-name{font-size:.88rem;font-weight:600;line-height:1.25;}
.card-cat{
  font-size:.68rem;color:var(--primary-dark);background:#f4ebff;
  padding:2px 8px;border-radius:20px;align-self:flex-start;
  font-weight:600;
}
.card-iva{
  font-size:.68rem;color:var(--text-soft);
  font-weight:600;letter-spacing:.02em;
}
.qty-row{
  margin-top:auto;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.qty-row .qbtn{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
  background:#fff;font-size:1rem;line-height:1;cursor:pointer;color:var(--primary);
}
.qty-row .qval{font-weight:700;font-size:.95rem;min-width:28px;text-align:center;}

.empty{
  text-align:center;padding:60px 20px;color:var(--text-soft);
}

.overlay{
  position:fixed;inset:0;background:rgba(30,20,60,.45);
  display:none;align-items:flex-start;justify-content:center;
  padding:20px;z-index:100;overflow-y:auto;
}
.overlay.open{display:flex;}
.modal{
  background:#fff;border-radius:16px;max-width:480px;width:100%;
  padding:22px;margin:20px 0 40px;
}
.modal h2{margin:0 0 16px;font-size:1.25rem;padding-left:12px;border-left:4px solid var(--primary);}
.field{margin-bottom:13px;}
.field label{display:block;font-size:.78rem;color:var(--text-soft);margin-bottom:4px;font-weight:600;}
.field input[type=text], .field input[type=number], .field textarea, .field select{
  width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;
  font-size:.9rem;font-family:inherit;color:var(--text);
}
.field textarea{resize:vertical;min-height:60px;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}
.photo-drop{
  border:2px dashed var(--border);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;cursor:pointer;text-align:center;position:relative;
  min-height:140px;background:#faf9ff;
}
.photo-drop.drag{border-color:var(--primary);background:#f0ecff;}
.photo-drop img{max-width:100%;max-height:160px;border-radius:8px;object-fit:contain;}
.photo-drop svg{width:32px;height:32px;color:#c9c1ec;}
.photo-drop span{font-size:.78rem;color:var(--text-soft);}
.photo-actions{display:flex;gap:8px;margin-top:8px;}
.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}
.modal-actions .right{display:flex;gap:8px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#2b2740;color:#fff;padding:10px 18px;border-radius:30px;
  font-size:.85rem;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1;}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);}
  header h1{font-size:1.25rem;}
}
</style>
</head>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar producto...">
    <select id="categoryFilter"></select>
    <select id="sortBy">
      <option value="name-asc">Nombre A-Z</option>
      <option value="name-desc">Nombre Z-A</option>
      <option value="qty-asc">Cantidad: menor a mayor</option>
      <option value="qty-desc">Cantidad: mayor a menor</option>
      <option value="cat">Categoría</option>
    </select>
    <button class="btn btn-primary" id="addBtn">+ Producto</button>
    <div class="menu-wrap">
      <button class="btn btn-ghost" id="menuBtn">⋮ Más</button>
      <div class="menu" id="menu">
        <button id="exportJsonBtn">⬇ Exportar copia de seguridad (JSON)</button>
        <button id="exportCsvBtn">⬇ Exportar a CSV</button>
        <label for="importInput">⬆ Importar copia de seguridad</label>
        <input type="file" id="importInput" accept="application/json" style="display:none;">
        <button id="fixCategoriesBtn">🔧 Corregir categorías antiguas</button>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nuevo producto</h2>
    <div class="field">
      <label>Foto</label>
      <div class="photo-drop" id="photoDrop">
        <div id="photoPreviewWrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>
          <span>Toca para subir o arrastra una imagen</span>
        </div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
      </div>
      <div class="photo-actions" id="photoActions" style="display:none;">
        <button type="button" class="btn btn-sm btn-ghost" id="changePhotoBtn">Cambiar foto</button>
        <button type="button" class="btn btn-sm btn-danger" id="removePhotoBtn">Quitar foto</button>
      </div>
    </div>
    <div class="field">
      <label>Nombre del producto</label>
      <input type="text" id="fName" placeholder="Ej: Shampoo LT">
    </div>
    <div class="row2">
      <div class="field">
        <label>Categoría</label>
        <select id="fCategory"></select>
      </div>
      <div class="field">
        <label>Unidad</label>
        <input type="text" id="fUnit" placeholder="und, lt, kit...">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Cantidad</label>
        <input type="number" id="fQty" min="0" step="1">
      </div>
      <div class="field">
        <label>Alertar si baja de</label>
        <input type="number" id="fMin" min="0" step="1" placeholder="0 = sin alerta">
      </div>
    </div>
    <div class="field">
      <label>Registro INVIMA</label>
      <input type="text" id="fInvima" placeholder="Ej: INVIMA NSO12345">
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="fNotes" placeholder="Observaciones, proveedor, ubicación..."></textarea>
    </div>
    <div class="field" id="historyWrap" style="display:none;">
      <label>Historial de entregas</label>
      <div id="historyList" style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.82rem;background:#faf9fc;"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Eliminar</button>
      <div class="right">
        <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="recipientOverlay">
  <div class="modal" style="max-width:380px;">

    <div class="field">
      <label>¿A quién se le entrega?</label>
      <input type="text" id="recipientName" placeholder="Nombre de quien recibe" autocomplete="off">

    </div>
    <div class="modal-actions">
      <div class="right" style="width:100%;justify-content:flex-end;display:flex;gap:8px;">

      </div>
    </div>
  </div>
</div>

function init(){
  bindEvents();

  firebase.database().ref('.info/connected').on('value', snap => {
    const badge = el('connStatus');
    if(!badge) return;
    if(snap.val() === true){
      badge.textContent = '🟢 En vivo';
      badge.style.color = 'var(--success)';
    } else {
      badge.textContent = '🔴 Sin conexión';
      badge.style.color = 'var(--danger)';
    }
  });

  dbRef.on('value', snapshot => {
    const val = snapshot.val();
    if(val === null){
      if(firstLoad){
        products = SEED_DATA;
        dbSeedAll(SEED_DATA);
      } else {
        products = [];
      }
    } else {
      products = Object.values(val);
    }
    firstLoad = false;
    render();
  }, err => {
    showToast('No se pudo conectar con la base de datos');
    console.error(err);
  });
}

function guessCategoryByName(name){
  const n = (name || '').toUpperCase();
  for(const [keywords, cat] of NAME_KEYWORD_RULES){
    for(const kw of keywords){
      if(n.includes(kw)) return cat;
    }
  }
  return null;
}

async function fixOldCategories(){
  const toFix = [];
  products.forEach(p => {
    if(FIXED_CATEGORIES.includes(p.category)) return; // ya es válida, no tocar
    const cat = (p.category || '').toUpperCase().trim();
    let newCat = CATEGORY_MIGRATION_MAP[cat] || guessCategoryByName(p.name);
    if(newCat && newCat !== p.category){
      toFix.push({ id: p.id, newCat });
    }
  });
  if(toFix.length === 0){
    showToast('No se encontraron categorías para corregir');
    return;
  }
  if(!confirm(`Se van a corregir ${toFix.length} producto(s) cuya categoría no coincide con las 11 válidas. ¿Continuar?`)) return;
  try{
    const updates = {};
    toFix.forEach(({id, newCat}) => { updates[`${id}/category`] = newCat; });
    await dbRef.update(updates);
    showToast(`${toFix.length} producto(s) corregido(s)`);
  }catch(err){
    showToast('No se pudo corregir (revisa tu conexión)');
  }
}

function isLow(p){
  return p.minStock > 0 && p.quantity <= p.minStock;
}

/* ---------- Render ---------- */
function render(){
  renderStats();
  renderCategoryFilter();
  renderGrid();
}

function renderStats(){
  const totalProducts = products.length;
  const totalUnits = products.reduce((s,p)=>s+Number(p.quantity||0),0);
  const cats = uniqueCategories().length;
  const low = products.filter(isLow).length;
  el('stats').innerHTML = `
    <div class="stat-card"><div class="num">${totalProducts}</div><div class="lbl">Productos</div></div>
    <div class="stat-card"><div class="num">${totalUnits}</div><div class="lbl">Unidades totales</div></div>
    <div class="stat-card"><div class="num">${cats}</div><div class="lbl">Categorías</div></div>
    <div class="stat-card ${low>0?'low':''}"><div class="num">${low}</div><div class="lbl">Stock bajo</div></div>
  `;
}

function renderCategoryFilter(){
  const sel = el('categoryFilter');
  const current = sel.value || 'all';
  const cats = uniqueCategories();
  sel.innerHTML = `<option value="all">Todas las categorías</option>` +
    cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  sel.value = cats.includes(current) ? current : 'all';

  const fCat = el('fCategory');
  if(fCat && !fCat.dataset.filled){
    fCat.innerHTML = FIXED_CATEGORIES.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    fCat.dataset.filled = '1';
  }
}

function renderGrid(){
  const q = el('search').value.trim().toLowerCase();
  const cat = el('categoryFilter').value;
  const sortBy = el('sortBy').value;

  let list = products.filter(p=>{
    const matchQ = !q || p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
    const matchC = cat === 'all' || p.category === cat;
    return matchQ && matchC;
  });

  list.sort((a,b)=>{
    switch(sortBy){
      case 'name-desc': return b.name.localeCompare(a.name);
      case 'qty-asc': return a.quantity - b.quantity;
      case 'qty-desc': return b.quantity - a.quantity;
      case 'cat': return (a.category||'').localeCompare(b.category||'') || a.name.localeCompare(b.name);
      default: return a.name.localeCompare(b.name);
    }
  });

  const grid = el('grid');
  if(list.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">No se encontraron productos.</div>`;
    return;
  }

  grid.innerHTML = list.map(p => `
    <div class="card ${isLow(p)?'low':''}" data-id="${p.id}">
      <div class="thumb">
        ${isLow(p)?'<div class="low-badge">STOCK BAJO</div>':''}
        ${p.photo ? `<img src="${p.photo}" alt="${escapeHtml(p.name)}">` :
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>`}
      </div>
      <div class="card-body">
        <div class="card-cat">${escapeHtml(p.category || 'Sin categoría')}</div>
        <div class="card-name">${escapeHtml(p.name)}</div>
        ${p.invimaCode ? `<div class="card-iva">INVIMA: ${escapeHtml(p.invimaCode)}</div>` : ''}
        <div class="qty-row">
          <button class="qbtn" data-action="dec" data-id="${p.id}">−</button>
          <span class="qval">${p.quantity} <small style="font-weight:400;color:var(--text-soft);">${escapeHtml(p.unit||'')}</small></span>
          <button class="qbtn" data-action="inc" data-id="${p.id}">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Cantidad rápida +/- (transacción atómica: segura si dos personas tocan a la vez) ---------- */
let pendingDec = null; // {id, product}

async function changeQty(id, delta){
  const p = products.find(p=>p.id===id);
  if(!p) return;
  if(delta < 0){
    // Pedir a quién se entrega antes de restar
    pendingDec = { id, product: p };
    el('recipientProductLabel').textContent = p.name;
    el('recipientName').value = '';
    el('recipientError').style.display = 'none';
    el('recipientOverlay').classList.add('open');
    setTimeout(()=> el('recipientName').focus(), 50);
    return;
  }
  try{
    await dbRef.child(String(id)).child('quantity').transaction(current => Math.max(0, (current||0) + delta));
  }catch(err){
    showToast('No se pudo actualizar (revisa tu conexión)');
  }
}

async function confirmDelivery(){
  const name = el('recipientName').value.trim();
  if(!name){
    el('recipientError').style.display = 'block';
    return;
  }
  if(!pendingDec) return;
  const { id } = pendingDec;
  try{
    await dbRef.child(String(id)).child('quantity').transaction(current => Math.max(0, (current||0) - 1));
    await dbRef.child(String(id)).child('history').push({
      date: Date.now(),
      delta: -1,
      recipient: name
    });
    showToast('Entrega registrada');
  }catch(err){
    showToast('No se pudo registrar (revisa tu conexión)');
  }
  pendingDec = null;
  el('recipientOverlay').classList.remove('open');
}

function cancelDelivery(){
  pendingDec = null;
  el('recipientOverlay').classList.remove('open');
}

function loadHistory(productId){
  const wrap = el('historyWrap');
  const list = el('historyList');
  if(!productId){
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  list.innerHTML = '<div style="color:var(--text-soft);">Cargando historial...</div>';
  dbRef.child(String(productId)).child('history').orderByChild('date').limitToLast(50).once('value', snapshot => {
    const entries = [];
    snapshot.forEach(child => { entries.push(child.val()); });
    entries.reverse();
    if(entries.length === 0){
      list.innerHTML = '<div style="color:var(--text-soft);">Sin entregas registradas todavía.</div>';
      return;
    }
    list.innerHTML = entries.map(h => {
      const d = new Date(h.date);
      const fecha = d.toLocaleDateString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' + d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
      return `<div style="padding:4px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;">
        <span>${escapeHtml(fecha)}</span>
        <span style="color:var(--danger);font-weight:600;">${h.delta}</span>
        <span style="text-align:right;flex:1;">${escapeHtml(h.recipient||'')}</span>
      </div>`;
    }).join('');
  }, err => {
    list.innerHTML = '<div style="color:var(--danger);">No se pudo cargar el historial.</div>';
  });
}

/* ---------- Modal ---------- */
function openModal(product){
  editingId = product ? product.id : null;
  currentPhoto = (product && product.photo) ? product.photo : null;
  el('modalTitle').textContent = product ? 'Editar producto' : 'Nuevo producto';
  el('fName').value = product ? product.name : '';
  el('fCategory').value = product ? product.category : FIXED_CATEGORIES[0];
  el('fUnit').value = product ? product.unit : 'und';
  el('fQty').value = product ? product.quantity : 0;
  el('fMin').value = product ? product.minStock : 0;
  el('fInvima').value = product ? (product.invimaCode || '') : '';
  el('fNotes').value = product ? product.notes : '';
  el('deleteBtn').style.display = product ? 'inline-flex' : 'none';
  updatePhotoPreview();
  loadHistory(editingId);
  el('overlay').classList.add('open');
}
function closeModal(){
  el('overlay').classList.remove('open');
  editingId = null;
  currentPhoto = null;
}
function updatePhotoPreview(){
  const wrap = el('photoPreviewWrap');
  const actions = el('photoActions');
  if(currentPhoto){
    wrap.innerHTML = `<img src="${currentPhoto}" alt="foto producto">`;
    actions.style.display = 'flex';
  } else {
    wrap.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg><span>Toca para subir o arrastra una imagen</span>`;
    actions.style.display = 'none';
  }
}

function compressImage(file, maxW = 900, quality = 0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  try{
    currentPhoto = await compressImage(file);
    updatePhotoPreview();
  }catch(err){
    showToast('No se pudo procesar la imagen');
  }
}

async function saveProduct(){
  const name = el('fName').value.trim();
  if(!name){ showToast('Escribe un nombre para el producto'); return; }
  const data = {
    name,
    category: el('fCategory').value.trim() || 'Sin categoría',
    unit: el('fUnit').value.trim() || 'und',
    quantity: Math.max(0, Number(el('fQty').value) || 0),
    minStock: Math.max(0, Number(el('fMin').value) || 0),
    invimaCode: el('fInvima').value.trim(),
    notes: el('fNotes').value.trim(),
    photo: currentPhoto
  };
  data.id = editingId || nextId();
  try{
    await dbPut(data);
    closeModal();
    showToast('Producto guardado');
  }catch(err){
    showToast('No se pudo guardar (revisa tu conexión)');
  }
}

async function deleteProduct(){
  if(!editingId) return;
  if(!confirm('¿Eliminar este producto del inventario? Se eliminará para todo el equipo.')) return;
  try{
    await dbDelete(editingId);
    closeModal();
    showToast('Producto eliminado');
  }catch(err){
    showToast('No se pudo eliminar (revisa tu conexión)');
  }
}

/* ---------- Exportar / Importar ---------- */
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportJson(){
  downloadBlob(JSON.stringify(products, null, 2), 'inventario-backup.json', 'application/json');
  showToast('Copia de seguridad descargada');
}

function exportCsv(){
  const header = ['Nombre','Categoría','Cantidad','Unidad','Alerta stock bajo','Registro INVIMA','Notas','Tiene foto'];
  const rows = products.map(p => [
    p.name, p.category, p.quantity, p.unit, p.minStock, p.invimaCode || '', p.notes, p.photo ? 'Sí' : 'No'
  ]);
  const csv = [header, ...rows].map(r =>
    r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  downloadBlob('﻿' + csv, 'inventario.csv', 'text/csv;charset=utf-8;');
  showToast('CSV descargado');
}

function importJson(file){
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('formato inválido');
      if(!confirm(`Se importarán ${data.length} productos y se reemplazará el inventario actual para TODO el equipo. ¿Continuar?`)) return;
      await dbClear();
      await dbSeedAll(data);
      showToast('Inventario importado');
    }catch(err){
      showToast('El archivo no es una copia de seguridad válida');
    }
  };
  reader.readAsText(file);
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- Eventos ---------- */
function bindEvents(){
  el('search').addEventListener('input', render);
  el('categoryFilter').addEventListener('change', renderGrid);
  el('sortBy').addEventListener('change', renderGrid);
  el('addBtn').addEventListener('click', () => openModal(null));

  el('grid').addEventListener('click', e => {
    const qbtn = e.target.closest('.qbtn');
    if(qbtn){
      e.stopPropagation();
      const id = Number(qbtn.dataset.id);
      changeQty(id, qbtn.dataset.action === 'inc' ? 1 : -1);
      return;
    }
    const card = e.target.closest('.card');
    if(card){
      const id = Number(card.dataset.id);
      const p = products.find(p=>p.id===id);
      if(p) openModal(p);
    }
  });

  el('cancelBtn').addEventListener('click', closeModal);
  el('saveBtn').addEventListener('click', saveProduct);
  el('deleteBtn').addEventListener('click', deleteProduct);
  el('overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });

  el('recipientConfirmBtn').addEventListener('click', confirmDelivery);
  el('recipientCancelBtn').addEventListener('click', cancelDelivery);
  el('recipientOverlay').addEventListener('click', e => { if(e.target.id === 'recipientOverlay') cancelDelivery(); });
  el('recipientName').addEventListener('keydown', e => { if(e.key === 'Enter') confirmDelivery(); });

  el('photoDrop').addEventListener('click', () => el('photoInput').click());
  el('changePhotoBtn').addEventListener('click', e => { e.stopPropagation(); el('photoInput').click(); });
  el('removePhotoBtn').addEventListener('click', e => { e.stopPropagation(); currentPhoto = null; updatePhotoPreview(); });
  el('photoInput').addEventListener('change', e => handlePhotoFile(e.target.files[0]));

  const drop = el('photoDrop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('drag');
    if(e.dataTransfer.files[0]) handlePhotoFile(e.dataTransfer.files[0]);
  });

  el('menuBtn').addEventListener('click', () => el('menu').classList.toggle('open'));
  document.addEventListener('click', e => {
    if(!e.target.closest('.menu-wrap')) el('menu').classList.remove('open');
  });
  el('exportJsonBtn').addEventListener('click', exportJson);
  el('fixCategoriesBtn').addEventListener('click', fixOldCategories);
  el('exportCsvBtn').addEventListener('click', exportCsv);
  el('importInput').addEventListener('change', e => { if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=''; });

  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
}

init();
</script>
