
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Zona Centro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f8; --card:#ffffff; --primary:#af62ff; --primary-dark:#8f3fe6;
  --ink:#000000; --text-soft:#6b6b76; --success:#22a55a; --danger:#e0473e;
  --shadow: 0 2px 10px rgba(0,0,0,.06);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Raleway',sans-serif;color:var(--ink);}
header{background:var(--primary-dark);color:#fff;padding:22px 24px;position:relative;}
header h1{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:1.6rem;}
header p{margin:0;color:#cfcfcf;font-size:.9rem;}
#connStatus{position:fixed;top:10px;right:10px;font-size:.72rem;padding:4px 10px;border-radius:20px;background:#fff;box-shadow:var(--shadow);z-index:300;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
.sedes-links{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 24px;}
.sedes-links a{background:var(--card);border-radius:10px;padding:8px 14px;text-decoration:none;color:var(--ink);font-size:.85rem;box-shadow:var(--shadow);font-weight:600;}
.sedes-links a:hover{background:var(--primary);color:#fff;}
.search-row{margin-bottom:14px;}
.search-row input{width:100%;max-width:340px;padding:10px 14px;border-radius:10px;border:1px solid #e2e2e6;font-family:inherit;font-size:.9rem;}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
thead th{background:var(--primary-dark);color:#fff;padding:10px 8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;text-align:center;position:sticky;top:0;}
thead th:first-child{text-align:left;}
tbody td{padding:9px 8px;border-bottom:1px solid #eee;text-align:center;font-size:.85rem;}
tbody td:first-child{text-align:left;font-weight:600;}
tbody tr:hover{background:#faf5ff;}
.total-col{font-weight:700;color:var(--primary-dark);}
.table-scroll{overflow-x:auto;border-radius:12px;}
.loading{padding:40px;text-align:center;color:var(--text-soft);}
.cat-badge{display:inline-block;background:#f1e6ff;color:var(--primary-dark);border-radius:20px;padding:2px 8px;font-size:.68rem;margin-left:6px;}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBSFpaUxIxx02ArcVabsnR4lMDH7tRIjZw",
  authDomain: "inventario-pasto.firebaseapp.com",
  databaseURL: "https://inventario-pasto-default-rtdb.firebaseio.com",
  projectId: "inventario-pasto",
  storageBucket: "inventario-pasto.firebasestorage.app",
  messagingSenderId: "727033202186",
  appId: "1:727033202186:web:b854974cb9bbd6596d41f3",
  measurementId: "G-MS000TVTWG"
};
firebase.initializeApp(firebaseConfig);

const SEDES = [
  { key: "products", label: "Pasto" },
  { key: "products_kennedy", label: "Kennedy" },
  { key: "products_chapinero", label: "Chapinero" },
  { key: "products_soacha", label: "Soacha" },
  { key: "products_fontibon", label: "Fontibón" },
  { key: "products_suba", label: "Suba" }
];

let sedeData = {};
let loadedCount = 0;
let allRows = [];

firebase.database().ref('.info/connected').on('value', snap => {
  const badge = document.getElementById('connStatus');
  if(snap.val() === true){
    badge.textContent = '🟢 En vivo';
    badge.style.color = '#22a55a';
  } else {
    badge.textContent = '🔴 Sin conexión';
    badge.style.color = '#e0473e';
  }
});

SEDES.forEach(sede => {
  firebase.database().ref(sede.key).on('value', snapshot => {
    const val = snapshot.val();
    sedeData[sede.key] = val ? Object.values(val) : [];
    renderTable();
  });
});

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTable(){
  // Consolida por nombre de producto (mayúsculas)
  const productMap = {};
  SEDES.forEach(sede => {
    const list = sedeData[sede.key] || [];
    list.forEach(p => {
      const name = (p.name || '').toUpperCase().trim();
      if(!name) return;
      if(!productMap[name]) {
        productMap[name] = { name, category: p.category || '', bySede: {} };
      }
      productMap[name].bySede[sede.key] = (productMap[name].bySede[sede.key] || 0) + (Number(p.quantity) || 0);
    });
  });

  allRows = Object.values(productMap).sort((a,b) => a.name.localeCompare(b.name));
  paintRows(allRows);
}

function paintRows(rows){
  const container = document.getElementById('tableContainer');
  if(rows.length === 0){
    container.innerHTML = '<div class="loading">Sin datos todavía. Las sedes aparecerán aquí a medida que carguen su inventario.</div>';
    return;
  }
  let html = '<div class="table-scroll"><table><thead><tr><th>Producto</th>';
  SEDES.forEach(s => html += `<th>${s.label}</th>`);
  html += '<th>Total</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr><td>${escapeHtml(r.name)}<span class="cat-badge">${escapeHtml(r.category)}</span></td>`;
    let total = 0;
    SEDES.forEach(s => {
      const q = r.bySede[s.key] || 0;
      total += q;
      html += `<td>${q}</td>`;
    });
    html += `<td class="total-col">${total}</td></tr>`;
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

document.getElementById('searchBox').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  const filtered = !q ? allRows : allRows.filter(r => r.name.toLowerCase().includes(q));
  paintRows(filtered);
});
</script>
